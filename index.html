<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haystack — Search 49,000+ LessWrong posts by karma, author, topic & more</title>
<meta name="description" content="Search and filter the full LessWrong archive by karma, author, year, word count, topic, and keywords. Better than LessWrong's own search.">
<meta property="og:title" content="Haystack — LessWrong Archive Search">
<meta property="og:description" content="Search 49,000+ LessWrong posts by karma, author, year, topic and keyword. Find the best rationality, AI safety, and philosophy writing ever published.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#CC0000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --raised:#F4F4F4; --raised-2:#FAFAFA;
  --ink:#111111; --ink-soft:#555555; --ink-faint:#999999;
  --line:#E0E0E0; --line-soft:#EBEBEB;
  --pine:#CC0000; --pine-deep:#990000; --pine-tint:#FFF0F0;
  --focus:#CC0000;
  --serif:'Spectral',Georgia,serif;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  /* karma heat scale (light mode) */
  --k0-bg:#E8E8E8; --k0-fg:#606060;
  --k1-bg:#FFAA00; --k1-fg:#1A0800;
  --k2-bg:#FF6800; --k2-fg:#1A0800;
  --k3-bg:#C41F00; --k3-fg:#FFFFFF;
  --k4-bg:#1A0800; --k4-fg:#FFAA00;
}
*{box-sizing:border-box}
html{height:100%;background:#D8D8D8}
body{height:100%;max-width:1400px;margin:0 auto;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;box-shadow:0 0 60px rgba(0,0,0,.12)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
::selection{background:var(--pine-tint)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Dark mode ---------- */
[data-theme="dark"]{
  background:#000000;
  --paper:#0D0D0D; --raised:#161616; --raised-2:#1E1E1E;
  --ink:#F2F2F2; --ink-soft:#BBBBBB; --ink-faint:#888888;
  --line:#2A2A2A; --line-soft:#222222;
  --pine:#FF2222; --pine-deep:#CC0000; --pine-tint:#2A0000;
  --focus:#FF2222;
  /* karma heat scale (dark mode) */
  --k0-bg:#2A2A2A; --k0-fg:#888888;
  --k1-bg:#FFAA00; --k1-fg:#1A0800;
  --k2-bg:#FF6800; --k2-fg:#1A0800;
  --k3-bg:#C41F00; --k3-fg:#FFFFFF;
  --k4-bg:#FFAA00; --k4-fg:#1A0800;
}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.75);}
[data-theme="dark"] .chip,[data-theme="dark"] .cat-tag{color:var(--pine);}
[data-theme="dark"] .searchbox input::placeholder{color:var(--ink-faint);}
[data-theme="dark"] select option{background:var(--raised-2);color:var(--ink);}
[data-theme="dark"] .aulist .arow:hover{background:var(--raised);}
[data-theme="dark"] .cooc .crow:hover{background:var(--raised);}
[data-theme="dark"] .arow-hdr{background:var(--raised-2)!important;}

/* ---------- Scrollbars ---------- */
/* Firefox */
*{scrollbar-width:thin;scrollbar-color:#C0C0C0 #F0F0F0}
[data-theme="dark"] *{scrollbar-color:#383838 #161616}
/* WebKit (Chrome, Edge, Safari) */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:#F0F0F0}
::-webkit-scrollbar-thumb{background:#C0C0C0;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#999999}
[data-theme="dark"] ::-webkit-scrollbar-track{background:#161616}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#383838}
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:#555555}

/* ---------- Theme transition (circular reveal) ---------- */
::view-transition-old(root),
::view-transition-new(root){animation:none;mix-blend-mode:normal;}

/* ---------- Loading / error screen ---------- */
#loadScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);z-index:50;flex-direction:column;gap:0}
.load-card{max-width:380px;width:100%;text-align:center;padding:40px 32px}
.load-card .mark{font-family:var(--serif);font-weight:600;font-size:42px;letter-spacing:-.02em;line-height:1;margin-bottom:18px}
.load-card .mark em{font-style:italic;color:var(--pine)}
.load-card p{color:var(--ink-soft);margin:0 0 20px;font-size:14px}
.load-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.load-fill{height:100%;background:var(--pine);width:0%;border-radius:2px}
.load-note{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.load-err{color:#c04040;margin-top:16px;font-size:13px}
.load-err code{font-family:var(--mono);background:var(--raised);padding:2px 6px;border-radius:3px;font-size:12px}

/* ---------- App shell ---------- */
#app{display:none;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
header.topbar{display:flex;align-items:center;gap:18px;padding:11px 18px;background:var(--raised);border-bottom:1px solid var(--line)}
.topbar .mark{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em}
.topbar .mark em{font-style:italic;color:var(--pine)}
.topbar .spacer{flex:1}
.ghost-btn{background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:6px 12px;border-radius:6px;font-size:12.5px;transition:.15s}
.ghost-btn:hover{border-color:var(--pine);color:var(--pine)}

/* body split */
.split{display:grid;grid-template-columns:1fr 286px;overflow:hidden}
aside.controls{order:2;border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 60px;background:var(--raised-2)}
main.results-pane{order:1;overflow-y:auto;padding:0 0 80px}

/* sidebar groups */
.grp{margin-bottom:20px}
.grp h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 9px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px}
.field .val{font-family:var(--mono);color:var(--ink);font-weight:500}
select,.txt{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--raised-2);color:var(--ink);font-size:13px}
input[type=range]{width:100%;accent-color:var(--pine)}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer}
.chk input{accent-color:var(--pine)}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--pine-tint);color:var(--pine-deep);border:none;padding:4px 9px;border-radius:20px;font-size:11.5px;transition:.12s}
.chip:hover{background:var(--pine);color:#fff}
.disc-btn{width:100%;text-align:left;background:var(--raised-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;color:var(--ink);transition:.12s;display:flex;justify-content:space-between;align-items:center}
.disc-btn:hover{border-color:var(--pine);color:var(--pine)}
.disc-btn span.k{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
/* Quality pills */
.q-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qp{border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.qp:hover{border-color:var(--pine);color:var(--pine)}
.qp.active{background:var(--pine);color:#fff;border-color:var(--pine)}
.q-hint{font-size:11px;color:var(--ink-faint);margin-top:5px;font-family:var(--mono);min-height:14px}
/* Era buttons */
.era-list{display:flex;flex-direction:column;gap:3px;margin-top:7px}
.era-btn{text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);padding:7px 10px;border-radius:6px;font-size:12px;cursor:pointer;transition:.15s;line-height:1.25;width:100%}
.era-btn:hover{border-color:var(--pine);color:var(--ink);background:var(--pine-tint)}
.era-btn.active{border-color:var(--pine);background:var(--pine-tint);color:var(--ink)}
.era-yr{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:2px}
.era-btn.active .era-yr{color:var(--pine)}
/* Sort pills */
.sort-list{display:flex;flex-direction:column;gap:2px;margin-top:7px}
.sp{text-align:left;border:1px solid transparent;background:transparent;color:var(--ink-soft);padding:5px 9px;border-radius:5px;font-size:12.5px;cursor:pointer;transition:.12s;width:100%}
.sp:hover{background:var(--raised);color:var(--ink)}
.sp.active{background:var(--pine-tint);color:var(--pine);font-weight:600}

/* search bar */
.searchwrap{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 22px 10px;border-bottom:1px solid var(--line-soft)}
.searchbox{position:relative}
.searchbox input{width:100%;padding:13px 15px 13px 40px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:var(--raised-2);color:var(--ink);font-family:var(--serif)}
.searchbox input:focus{border-color:var(--pine)}
.searchbox .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
.searchmeta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--ink-soft)}
.searchmeta .count b{color:var(--ink);font-family:var(--mono);font-weight:500}
.fuzzynote{font-family:var(--mono);font-size:11px;color:var(--pine)}

/* results */
.results{padding:6px 22px 0}
.card{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:start;padding:13px 14px;border:1px solid transparent;border-bottom:1px solid var(--line-soft);border-radius:8px}
.card:hover{background:var(--raised-2);border-color:var(--line)}
.karma{font-family:var(--mono);font-weight:500;font-size:13px;text-align:center;padding:4px 0;border-radius:6px;line-height:1.1}
.karma small{display:block;font-size:9px;font-weight:500;margin-top:1px;opacity:0.8}
.card .body .title{font-family:var(--serif);font-size:16.5px;font-weight:500;color:var(--ink);text-decoration:none;line-height:1.3}
.card .body .title:hover{color:var(--pine);text-decoration:underline}
.card .body .title mark{background:var(--pine-tint);color:inherit;padding:0 1px;border-radius:2px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px}
.meta .author{color:var(--ink-soft)}
.meta .alink{cursor:pointer}
.meta .alink:hover{color:var(--pine);text-decoration:underline}
.cat-tag{display:inline-block;font-family:var(--sans);font-size:10.5px;background:var(--pine-tint);color:var(--pine-deep);padding:1px 7px;border-radius:4px;margin-top:6px}
.actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;font-size:14px;color:var(--ink-faint);display:flex;align-items:center;justify-content:center;transition:.12s}
.icon-btn:hover{border-color:var(--pine);color:var(--pine)}
.icon-btn.on{background:var(--pine);border-color:var(--pine);color:#fff}
.icon-btn.mlt{font-size:12px}
.showmore{display:block;margin:18px auto 0;background:var(--raised-2);border:1px solid var(--line);border-radius:7px;padding:10px 22px;color:var(--ink-soft);font-size:13px}
.showmore:hover{border-color:var(--pine);color:var(--pine)}
.empty{text-align:center;color:var(--ink-faint);padding:70px 20px;font-size:14px}
.empty b{color:var(--ink-soft)}

/* overlay panel */
.overlay{position:fixed;inset:0;background:rgba(20,28,24,.34);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:50px 16px}
.overlay.show{display:flex}
.panel{background:var(--raised-2);border-radius:12px;max-width:680px;width:100%;max-height:84vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0}
.panel-head .sub{font-size:12px;color:var(--ink-faint);font-family:var(--mono)}
.panel-body{overflow-y:auto;padding:8px 12px 18px}
.panel .card{grid-template-columns:50px 1fr auto}
.close-x{background:transparent;border:none;font-size:22px;color:var(--ink-faint);line-height:1}
.close-x:hover{color:var(--ink)}
.aulist .arow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line-soft);align-items:center;font-size:13px}
.aulist .arow:hover{background:var(--raised)}
.aulist .aname{font-weight:500;color:var(--pine-deep);cursor:pointer}
.aulist .aname:hover{text-decoration:underline}
.aulist .anum{font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-align:right}
.aulist .ahdr{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.cooc .crow{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;cursor:pointer}
.cooc .crow:hover{background:var(--raised);color:var(--pine)}
.cooc .cn{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}

@media(max-width:760px){
  .split{grid-template-columns:1fr}
  aside.controls{position:fixed;inset:0 0 0 20%;z-index:30;display:none;box-shadow:-4px 0 20px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .22s ease}
  aside.controls.open{display:block;transform:translateX(0)}
  .card{grid-template-columns:46px 1fr}
  .actions{flex-direction:row;grid-column:1/-1;justify-content:flex-start;margin-top:4px}
  .filter-toggle{display:inline-flex;align-items:center;gap:6px}
  .ghost-btn.desktop-only{display:none}
  .share-btn.desktop-only{display:none}
  .theme-btn{padding:5px 8px}
  .qfilters{overflow-x:auto;flex-wrap:nowrap;padding:6px 14px}
  .qf-lbl{display:none}
  .clear-btn{display:none}
}

/* ---------- Author browse panel ---------- */
.au-search-wrap{padding:10px 12px 8px;position:sticky;top:0;background:var(--raised-2);z-index:3;border-bottom:1px solid var(--line-soft)}
.au-search-wrap .txt{margin:0}
.au-letter-hdr{padding:5px 12px 3px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pine);background:var(--raised);border-bottom:1px solid var(--line-soft);position:sticky;top:48px;z-index:2}
.arow-hdr{background:var(--raised-2);font-size:10.5px;}
.au-count{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding:6px 12px 2px;text-align:right}

/* ---------- Dark-mode toggle btn ---------- */
.theme-btn{background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:5px 9px;border-radius:6px;font-size:15px;line-height:1;transition:.15s}
.theme-btn:hover{border-color:var(--pine);color:var(--pine)}

/* ---------- Share / mobile btns ---------- */
.share-btn{background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:6px 12px;border-radius:6px;font-size:12.5px;transition:.15s}
.share-btn:hover{border-color:var(--pine);color:var(--pine)}
.share-btn.copied{border-color:var(--pine);color:var(--pine);background:var(--pine-tint)}
.filter-toggle{display:none;background:var(--pine);color:#fff;border:none;padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:500;position:relative}
.filter-badge{position:absolute;top:-5px;right:-5px;background:#c04040;color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;line-height:1.4;display:none}
.filter-badge.show{display:block}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
.sidebar-backdrop.show{display:block}

/* ---------- Quick filters row ---------- */
.qfilters{background:var(--raised);border-bottom:1px solid var(--line);padding:7px 18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qf-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-right:4px;white-space:nowrap}
.qchip{background:var(--raised-2);border:1px solid var(--line);color:var(--ink-soft);padding:4px 10px;border-radius:20px;font-size:11.5px;transition:.12s;white-space:nowrap}
.qchip:hover{border-color:var(--pine);color:var(--pine);background:var(--pine-tint)}
.qf-div{width:1px;height:18px;background:var(--line);margin:0 2px;flex-shrink:0;align-self:center}
.clear-btn{margin-left:auto;background:transparent;border:none;font-size:11px;color:var(--ink-faint);text-decoration:underline;cursor:pointer;padding:0}
.clear-btn:hover{color:var(--pine)}
/* Collections */
.coll-btn{width:100%;text-align:left;background:var(--raised-2);border:1px solid var(--line);border-radius:7px;padding:8px 11px;margin-bottom:5px;font-size:12.5px;color:var(--ink);transition:.12s;cursor:pointer;line-height:1.3}
.coll-btn:hover{border-color:var(--pine);color:var(--pine)}
.coll-btn.active{border-color:var(--pine);background:var(--pine-tint);color:var(--pine-deep);font-weight:600}
.coll-btn small{display:block;font-size:10.5px;color:var(--ink-faint);font-weight:400;margin-top:2px}
.coll-btn.active small{color:var(--pine-deep);opacity:.8}
.coll-badge{display:inline-block;background:var(--pine);color:#fff;font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:10px;margin-left:7px;vertical-align:middle}
.active-note{font-family:var(--mono);font-size:11px;color:var(--pine);white-space:nowrap}

/* ---------- Footer ---------- */
.site-footer{padding:20px 22px;font-size:12px;color:var(--ink-faint);border-top:1px solid var(--line-soft);font-family:var(--mono)}
.site-footer a{color:var(--ink-faint);text-decoration:underline}
.site-footer a:hover{color:var(--pine)}

/* ---------- Personal tags ---------- */
.ptags-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;align-items:center}
.ptag{background:transparent;border:1.5px dashed #b0bab2;color:var(--ink-soft);padding:2px 8px;border-radius:20px;font-size:11px;font-family:var(--sans);cursor:pointer;transition:.12s;line-height:1.4}
.ptag:hover{border-color:var(--pine);color:var(--pine);background:var(--pine-tint)}
.ptag-add{background:transparent;border:1.5px dashed var(--line);color:var(--ink-faint);padding:2px 8px;border-radius:20px;font-size:11px;font-family:var(--sans);cursor:pointer;transition:.12s;line-height:1.4}
.ptag-add:hover{border-color:var(--pine);color:var(--pine)}
.ptag-input{border:1.5px solid var(--pine);border-radius:20px;padding:2px 9px;font-size:11px;font-family:var(--sans);color:var(--ink);outline:none;width:100px;line-height:1.4}
</style>
</head>
<body>

<!-- LOADING / ERROR -->
<div id="loadScreen">
  <div class="load-card">
    <div class="mark">Hay<em>stack</em></div>
    <p>Loading the LessWrong archive…</p>
    <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
    <div class="load-note" id="loadNote">Fetching data…</div>
    <div class="load-err" id="loadErr" style="display:none"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar">
    <div class="mark">Hay<em>stack</em></div>
    <div class="spacer"></div>
    <button class="share-btn desktop-only" id="shareBtn" title="Copy link to this view">🔗 Share view</button>
    <button class="ghost-btn desktop-only" id="authorsBtn">Authors</button>
    <button class="theme-btn" id="themeBtn" title="Toggle dark mode">🌙</button>
    <button class="filter-toggle" id="filterToggle">Filters <span class="filter-badge" id="filterBadge">0</span></button>
  </header>

  <div class="qfilters" id="qfilters">
    <span class="qf-lbl">Quick:</span>
    <span class="active-note" id="activeNote" style="display:none"></span>
  </div>

  <div class="sidebar-backdrop" id="backdrop"></div>
  <div class="split">
    <aside class="controls">

      <div class="grp">
        <h3>Discover</h3>
        <button class="disc-btn" id="surpriseBtn">Surprise me <span class="k">random high-karma</span></button>
        <button class="disc-btn" id="authorsBtnSide">Browse authors A→Z <span class="k">searchable</span></button>
        <button class="disc-btn" id="tagCoocBtn">Tag neighbours <span class="k">co-occurrence</span></button>
        <button class="disc-btn" id="exportBtn">Export this view <span class="k">.csv</span></button>
        <button class="disc-btn" id="exportBmBtn">Export bookmarks <span class="k">.csv</span></button>
      </div>

      <div class="grp">
        <h3>Quality</h3>
        <div class="q-pills">
          <button class="qp active" data-k="0">All</button>
          <button class="qp" data-k="25">Noticed</button>
          <button class="qp" data-k="75">Good</button>
          <button class="qp" data-k="200">Great</button>

/* ── Dark mode ── */
(function(){
  const saved=localStorage.getItem('lw_theme');
  const sys=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=saved||sys;
})();
function applyTheme(next){
  document.documentElement.dataset.theme=next;
  localStorage.setItem('lw_theme',next);
  $('#themeBtn').textContent=next==='dark'?'☀️':'🌙';
}
function toggleTheme(){
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  const btn=$('#themeBtn');
  const r=btn.getBoundingClientRect();
  const x=r.left+r.width/2, y=r.top+r.height/2;
  const maxR=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  if(!document.startViewTransition){applyTheme(next);return;}
  const vt=document.startViewTransition(()=>applyTheme(next));
  vt.ready.then(()=>{
    document.documentElement.animate(
      {clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${maxR}px at ${x}px ${y}px)`]},
      {duration:1300,easing:'ease-out',pseudoElement:'::view-transition-new(root)'}
    );
  });
}

/* ── URL state — encode all filters in the hash so views are shareable ── */
function serializeState(){
  const p=new URLSearchParams();
  const q=$('#search').value.trim(); if(q) p.set('q',q);
  const k=$('#karmaFloor').value; if(+k>0) p.set('k',k);
  const opts=[...$('#yearMin').options].map(o=>o.value);
  const y1=$('#yearMin').value, y2=$('#yearMax').value;
  if(opts.length&&y1!==opts[0]) p.set('y1',y1);
  if(opts.length&&y2!==opts[opts.length-1]) p.set('y2',y2);
  const cat=$('#catSel').value; if(cat) p.set('cat',cat);
  const auth=$('#authorFilter').value.trim(); if(auth) p.set('auth',auth);
  const tag=$('#tagSel').value; if(tag) p.set('tag',tag);
  const sort=$('#sortSel').value; if(sort&&sort!=='relevance') p.set('sort',sort);
  if($('#bmOnly').checked) p.set('bm','1');
  const s=p.toString();
  history.replaceState(null,'',s?'#'+s:location.pathname+location.search);
}
function deserializeState(){
  if(!location.hash||location.hash==='#') return;
  const p=new URLSearchParams(location.hash.slice(1));
  if(p.has('q')){$('#search').value=p.get('q');}
  if(p.has('k'))$('#karmaFloor').value=p.get('k');
  if(p.has('y1'))$('#yearMin').value=p.get('y1');
  if(p.has('y2'))$('#yearMax').value=p.get('y2');
  if(p.has('cat'))$('#catSel').value=p.get('cat');
  if(p.has('auth'))$('#authorFilter').value=p.get('auth');
  if(p.has('tag'))$('#tagSel').value=p.get('tag');
  if(p.has('sort'))$('#sortSel').value=p.get('sort');
  if(p.has('bm'))$('#bmOnly').checked=p.get('bm')==='1';
  syncPillStates();
}

/* ── Share view ── */
function shareView(){
  serializeState();
  const url=location.href;
  navigator.clipboard.writeText(url).then(()=>{
    const btn=$('#shareBtn'); btn.textContent='✓ Copied!'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='🔗 Share view';btn.classList.remove('copied');},2000);
  }).catch(()=>prompt('Copy this link:',url));
}

/* ── Active filter count ── */
function activeFilters(){
  let n=0;
  if($('#search').value.trim()) n++;
  if(+$('#karmaFloor').value>0) n++;
  const opts=[...$('#yearMin').options].map(o=>o.value);
  if(opts.length&&($('#yearMin').value!==opts[0]||$('#yearMax').value!==opts[opts.length-1])) n++;
  if($('#catSel').value) n++;
  if($('#authorFilter').value.trim()) n++;
  if($('#tagSel').value) n++;
  if($('#bmOnly').checked) n++;
  return n;
}
function updateFilterBadge(){
  const n=activeFilters();
  const badge=$('#filterBadge');
  badge.textContent=n; badge.classList.toggle('show',n>0);
  const note=$('#activeNote');
  if(n>0){note.textContent=n+' filter'+(n>1?'s':'')+' active';note.style.display='';}
  else note.style.display='none';
}

/* ── Clear all filters ── */
function clearAllFilters(){
  $('#search').value='';
  $('#karmaFloor').value=0;
  const opts=[...$('#yearMin').options].map(o=>o.value);
  if(opts.length){$('#yearMin').value=opts[0];$('#yearMax').value=opts[opts.length-1];}
  $('#catSel').value=''; $('#authorFilter').value=''; $('#tagSel').value='';
  $('#sortSel').value='relevance'; $('#bmOnly').checked=false;
  syncPillStates();update();
}

let CURATED_IDS=null, CURATED_LABEL='';

function buildCurated(){
  const list=$('#collList');
  CURATED.forEach(c=>{
    const b=document.createElement('button');
    b.className='coll-btn'; b.dataset.label=c.label;
    // desc contains "(N posts)" at end — split it for badge display
    const descMatch=c.desc.match(/^(.*?)\s*\((\d+) posts\)$/);
    const descText=descMatch?descMatch[1]:c.desc;
    const cnt=descMatch?descMatch[2]:c.ids.length;
    b.innerHTML=`${c.label} <span class="coll-badge">${cnt}</span><small>${descText}</small>`;
    b.onclick=()=>{
      const active=b.classList.contains('active');
      document.querySelectorAll('.coll-btn').forEach(x=>x.classList.remove('active'));
      if(active){CURATED_IDS=null;CURATED_LABEL='';}
      else{CURATED_IDS=new Set(c.ids);CURATED_LABEL=c.label;b.classList.add('active');}
      update();
    };
    list.appendChild(b);
  });
}

/* ── Auto-fetch CSV with progress ── */
async function autoLoad(){
  const fill=$('#loadFill'), note=$('#loadNote'), err=$('#loadErr');
  try{
    note.textContent='Connecting…';
    const res=await fetch(DATA_URL);
    if(!res.ok) throw new Error('Server returned '+res.status+' for '+DATA_URL);
    const total=+res.headers.get('content-length')||0;
    let loaded=0, lastPaint=0;
    const reader=res.body.getReader();
    const chunks=[];
    while(true){
      const{done,value}=await reader.read();
      if(done) break;
      chunks.push(value); loaded+=value.length;
      const now=Date.now();
      if(now-lastPaint>80){
        lastPaint=now;
        const pct=total?Math.round(loaded/total*90):Math.min(85,Math.round(loaded/50000));
        fill.style.width=pct+'%';
        note.textContent=total?'Loading… '+pct+'%':'Loading… '+Math.round(loaded/1024)+' KB';
      }
    }
    const pctFinal=total?90:85;
    fill.style.width=pctFinal+'%';
    note.textContent='Parsing…';
    const bytes=new Uint8Array(loaded);
    let offset=0; for(const c of chunks){bytes.set(c,offset);offset+=c.length;}
    const text=new TextDecoder().decode(bytes);
    fill.style.width='100%';
    ingest(text);
    if(DATA_LABEL) $('#dataDate').textContent='data: '+DATA_LABEL;
    else{
      const newest=ROWS.reduce((mx,r)=>r.Date>mx?r.Date:mx,'');
      if(newest) $('#dataDate').textContent='data through '+newest.slice(0,7);
    }
    $('#loadScreen').style.display='none';
  }catch(e){
    err.innerHTML='<b>Could not load data.</b><br>'+e.message+'<br><br>Make sure <code>'+DATA_URL+'</code> exists and this page is served from an HTTP server (not opened as a file:// URL).';
    err.style.display='';
    fill.style.width='0';
    note.textContent='';
  }
}

/* ---------- CSV parser (handles quotes, commas, newlines) ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1); // strip BOM
  const rows=[]; let row=[], field='', i=0, inQ=false;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}

function classify(title,tags){
  // search both title and tags for keywords — the original only searched title
  const t=' '+title.toLowerCase()+' '+tags.toLowerCase()+' ';
  const tagset=tags.split(',').map(s=>s.trim());
  let best='Miscellaneous',score=0;
  for(const c of CATS){
    let s=0;
    for(const tg of c.tags) if(tagset.includes(tg)) s+=4;
    for(const k of c.kw) if(t.includes(k)) s+=1;
    if(s>score){score=s;best=c.name;}
  }
  // fallback: any tag containing 'AI' → capabilities bucket
  if(score===0 && tagset.some(tg=>tg.toLowerCase().includes('ai'))) return 'AI · Capabilities & Progress';
  return best;
}

/* ---------- Load & prep ---------- */
function ingest(text){
  const grid=parseCSV(text);
  const header=grid[0].map(h=>h.trim());
  const missing=REQUIRED.filter(c=>!header.includes(c));
  if(missing.length) throw new Error("Missing columns: "+missing.join(", "));
  const idx={}; header.forEach((h,i)=>idx[h]=i);
  ROWS=[];
  for(let r=1;r<grid.length;r++){
    const g=grid[r]; if(!g.length||(g.length===1&&g[0]==='')) continue;
    const o={
      Title:g[idx.Title]||'', URL:g[idx.URL]||'', Author:g[idx.Author]||'',
      Date:g[idx.Date]||'', Year:+g[idx.Year]||0, Karma:+g[idx.Karma]||0,
      Votes:+g[idx.Votes]||0, Comments:+g[idx.Comments]||0,
      WordCount:+g[idx["Word Count"]]||0, Tags:g[idx.Tags]||'', ID:g[idx["Post ID"]]||''
    };
    o._t=(o.Title+' '+o.Author+' '+o.Tags).toLowerCase();
    o._titleLow=o.Title.toLowerCase();
    o._cat=classify(o.Title,o.Tags);
    o._words=o._titleLow.match(/[a-z][a-z'-]{2,}/g)||[];
    ROWS.push(o);
  }
  // vocab + per-year karma
  YEAR_KARMA={};
  for(const o of ROWS){
    for(const w of o._words) VOCAB.add(w);
    (YEAR_KARMA[o.Year]=YEAR_KARMA[o.Year]||[]).push(o.Karma);
  }
  for(const y in YEAR_KARMA) YEAR_KARMA[y].sort((a,b)=>a-b);
  for(const o of ROWS){
    const arr=YEAR_KARMA[o.Year];
    let lo=0,hi=arr.length; const v=o.Karma;
    while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<v) lo=m+1; else hi=m;}
    o._pct=arr.length>1? lo/(arr.length-1):1;
  }
  buildControls();
  buildQuickFilters();
  buildCurated();
  $('#app').style.display='grid';
  deserializeState();   // URL hash takes priority over localStorage
  restoreSettings();    // fills in any remaining slots localStorage remembers
  syncPillStates();
  update();
}

/* ---------- Search ---------- */
function tokenize(q){
  const phrases=[...q.matchAll(/"([^"]+)"/g)].map(m=>m[1].toLowerCase().trim());
  const rest=q.replace(/"[^"]+"/g,' ');
  const words=(rest.toLowerCase().match(/[a-z0-9][a-z0-9'-]*/g)||[]).map(stem);
  return {phrases,words};
}
function stem(w){ return w.replace(/(ing|ed|ies|es|s)$/,m=>w.length-m.length>=3?'':m); }
function edits1(w){
  const out=new Set(),a='abcdefghijklmnopqrstuvwxyz';
  for(let i=0;i<=w.length;i++){
    if(i<w.length) out.add(w.slice(0,i)+w.slice(i+1));        // delete
    for(const c of a){
      out.add(w.slice(0,i)+c+w.slice(i));                      // insert
      if(i<w.length) out.add(w.slice(0,i)+c+w.slice(i+1));     // sub
    }
  }
  return out;
}
function searchScore(o,tok,expand){
  for(const p of tok.phrases){ if(!o._t.includes(p)) return -1; }
  let score=0;
  for(const w of tok.words){
    if(o._t.includes(w)){ score+= o._titleLow.includes(w)?2:1; continue; }
    if(expand && expand[w]){
      let hit=false;
      for(const cand of expand[w]) if(o._t.includes(cand)){hit=true;break;}
      if(hit){score+=0.5;continue;}
    }
    return -1; // AND logic: every term must match
  }
  // blend with karma (log) so strong+popular ranks above strong+obscure
  return score*100 + Math.log10(o.Karma+1)*8 + tok.phrases.length*40;
}

/* ---------- Main update pipeline ---------- */
function update(){
  const q=$('#search').value.trim();
  const tok=tokenize(q);
  const kFloor=+$('#karmaFloor').value;
  const yMin=+$('#yearMin').value, yMax=+$('#yearMax').value;
  const cat=$('#catSel').value;
  const auth=$('#authorFilter').value.trim().toLowerCase();
  const tag=$('#tagSel').value;
  const bmOnly=$('#bmOnly').checked;
  const sort=$('#sortSel').value;
  const searching=(tok.words.length||tok.phrases.length);

  // fuzzy expansion only when query present (built lazily, cheap)
  let expand=null; lastFuzzy=false;
  if(searching){
    expand={};
    for(const w of tok.words){
      if(w.length>=4 && !VOCAB.has(w)){
        const cands=[...edits1(w)].filter(c=>VOCAB.has(c));
        if(cands.length){expand[w]=cands;lastFuzzy=true;}
      }
    }
  }

  let out=[];
  for(const o of ROWS){
    if(CURATED_IDS && !CURATED_IDS.has(o.ID)) continue;
    if(o.Karma<kFloor) continue;
    if(o.Year<yMin||o.Year>yMax) continue;
    if(cat && o._cat!==cat) continue;
    if(auth && o.Author.toLowerCase()!==auth) continue;
    if(tag && !o.Tags.split(',').map(s=>s.trim()).includes(tag)) continue;
    if(bmOnly && !BOOKMARKS.has(o.ID)) continue;
    if(searching){ const sc=searchScore(o,tok,expand); if(sc<0) continue; o._score=sc; }
    out.push(o);
  }

  // sort
  const cmp={
    relevance:(a,b)=> searching ? b._score-a._score : b.Karma-a.Karma,
    karma:(a,b)=>b.Karma-a.Karma,
    pct:(a,b)=>b._pct-a._pct,
    date_desc:(a,b)=>(b.Date||'').localeCompare(a.Date||''),
    date_asc:(a,b)=>(a.Date||'').localeCompare(b.Date||''),
    comments:(a,b)=>b.Comments-a.Comments,
    title:(a,b)=>a.Title.localeCompare(b.Title)
  }[sort]||((a,b)=>b.Karma-a.Karma);
  out.sort(cmp);

  VIEW=out;
  RENDER_LIMIT=100;
  renderResults();
  const collTag=CURATED_LABEL?` · ${CURATED_LABEL}`:'';
  $('#resultCount').textContent=out.length===ROWS.length
    ?`${out.length.toLocaleString()} posts${collTag}`
    :`${out.length.toLocaleString()} of ${ROWS.length.toLocaleString()} posts${collTag}`;
  $('#fuzzyNote').textContent=lastFuzzy?'≈ fuzzy matches included (typo-tolerant)':'';
  $('#bmCount').textContent=BOOKMARKS.size;
  serializeState();
  updateFilterBadge();
  saveSettings();
}

/* ---------- Render: results ---------- */
function karmaStyle(k){
  const t=k>=400?4:k>=150?3:k>=50?2:k>=10?1:0;
  return `background:var(--k${t}-bg);color:var(--k${t}-fg)`;
}
function hl(title,tok){
  if(!tok || (!tok.words.length&&!tok.phrases.length)) return esc(title);
  let html=esc(title);
  const terms=[...tok.phrases,...tok.words].filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const t of terms){
    try{ html=html.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }catch(e){}
  }
  return html;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function cardHTML(o,tok){
  const star=BOOKMARKS.has(o.ID);
  return `<div class="card" data-id="${esc(o.ID)}">
    <div class="karma" style="${karmaStyle(o.Karma)}">${o.Karma}<small>karma</small></div>
    <div class="body">
      <a class="title" href="${esc(o.URL)}" target="_blank" rel="noopener">${hl(o.Title,tok)}</a>
      <div class="meta">
        <span class="author alink" data-au="${esc(o.Author||'')}">${esc(o.Author||'—')}</span>
        <span>${esc(o.Date)}</span>
        <span>${o.Comments} comments</span>
        ${o.WordCount?`<span>${o.WordCount.toLocaleString()} words</span>`:''}
      </div>
      <span class="cat-tag">${esc(o._cat)}</span>
    </div>
    <div class="actions">
      <button class="icon-btn star ${star?'on':''}" title="Bookmark">${star?'★':'☆'}</button>
      <button class="icon-btn mlt" title="More like this">≈</button>
    </div>
  </div>`;
}
function renderResults(){
  const box=$('#results');
  if(!VIEW.length){ box.innerHTML='<div class="empty"><b>No posts match.</b><br>Loosen a filter, lower the karma floor, or clear the search.</div>'; return; }
  const tok=tokenize($('#search').value.trim());
  const slice=VIEW.slice(0,RENDER_LIMIT);
  let html=slice.map(o=>cardHTML(o,tok)).join('');
  if(VIEW.length>RENDER_LIMIT) html+=`<button class="showmore" id="showMore">Show ${Math.min(100,VIEW.length-RENDER_LIMIT)} more · ${(VIEW.length-RENDER_LIMIT).toLocaleString()} hidden</button>`;
  box.innerHTML=html;
}

function toggleBookmark(id){
  if(BOOKMARKS.has(id)) BOOKMARKS.delete(id); else BOOKMARKS.add(id);
  localStorage.setItem('lw_bookmarks',JSON.stringify([...BOOKMARKS]));
  $('#bmCount').textContent=BOOKMARKS.size;
}

/* ---------- Discovery: more like this ---------- */
function moreLikeThis(o){
  const tags=new Set(o.Tags.split(',').map(s=>s.trim()).filter(Boolean));
  const words=new Set(o._words.filter(w=>w.length>4));
  const scored=[];
  for(const r of ROWS){
    if(r.ID===o.ID) continue;
    let s=0;
    r.Tags.split(',').forEach(t=>{if(tags.has(t.trim()))s+=2;});
    for(const w of r._words) if(words.has(w)) s+=1;
    if(s>0) scored.push([s+Math.log10(r.Karma+1),r]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  openPanel('More like this','“'+o.Title.slice(0,60)+'”',
    scored.slice(0,15).map(([,r])=>cardHTML(r,null)).join('')||'<div class="empty">No close neighbours found.</div>');
}

/* ---------- Discovery: author deep-dive ---------- */
function authorDeepDive(){
  const agg={};
  ROWS.forEach(r=>{const a=r.Author||'—'; if(!agg[a])agg[a]={n:0,k:0}; agg[a].n++; agg[a].k+=r.Karma;});

  // all authors, A → Z
  const all=Object.entries(agg)
    .map(([a,v])=>({a, n:v.n, avg:Math.round(v.k/v.n), tot:v.k}))
    .sort((x,y)=>x.a.localeCompare(y.a, undefined, {sensitivity:'base'}));

  // group by first letter
  const groups={};
  all.forEach(r=>{
    const ch=r.a.replace(/^[^A-Za-z]*/,'')[0];  // skip leading non-alpha
    const key=ch? ch.toUpperCase() : '#';
    (groups[key]=groups[key]||[]).push(r);
  });

  function rowsHTML(rs){
    return rs.map(r=>`<div class="arow"><span class="aname" data-au="${esc(r.a)}">${esc(r.a)}</span><span class="anum">${r.n}</span><span class="anum">${r.avg.toLocaleString()}</span><span class="anum">${r.tot.toLocaleString()}</span></div>`).join('');
  }

  const lettersHTML=Object.keys(groups).sort().map(letter=>
    `<div class="au-letter-hdr" data-letter="${letter}">${letter}</div>`+rowsHTML(groups[letter])
  ).join('');

  const body=`
    <div class="au-search-wrap">
      <input class="txt" id="auSearch" placeholder="Search ${all.length.toLocaleString()} authors…" autocomplete="off" spellcheck="false">
    </div>
    <div class="aulist" id="auList">
      <div class="arow arow-hdr"><span class="ahdr">Author</span><span class="ahdr anum">posts</span><span class="ahdr anum">avg ★</span><span class="ahdr anum">total ★</span></div>
      ${lettersHTML}
    </div>`;

  openPanel('Browse authors','A → Z · click a name to filter by author',body);

  // wire search after panel renders
  requestAnimationFrame(()=>{
    const inp=$('#auSearch'); if(!inp) return;
    inp.focus();
    inp.addEventListener('input',()=>{
      const q=inp.value.trim().toLowerCase();
      const list=$('#auList'); if(!list) return;
      // show/hide rows
      list.querySelectorAll('.arow:not(.arow-hdr)').forEach(row=>{
        const nm=row.querySelector('.aname');
        if(nm) row.style.display=(!q||nm.textContent.toLowerCase().includes(q))?'':'none';
      });
      // hide letter headers whose entire group is hidden
      list.querySelectorAll('.au-letter-hdr').forEach(hdr=>{
        let sib=hdr.nextElementSibling, vis=false;
        while(sib && !sib.classList.contains('au-letter-hdr')){
          if(sib.style.display!=='none') vis=true;
          sib=sib.nextElementSibling;
        }
        hdr.style.display=vis?'':'none';
      });
    });
  });
}

/* ---------- Discovery: tag co-occurrence ---------- */
function tagCooc(){
  const seed=$('#tagSel').value;
  if(!seed){ openPanel('Tag neighbours','pick a tag in the sidebar first','<div class="empty">Choose a tag in the left panel, then reopen this.</div>'); return; }
  const co={};
  ROWS.forEach(r=>{const ts=r.Tags.split(',').map(s=>s.trim());if(ts.includes(seed))ts.forEach(t=>{if(t&&t!==seed)co[t]=(co[t]||0)+1;});});
  const rows=Object.entries(co).sort((a,b)=>b[1]-a[1]).slice(0,30);
  const body=`<div class="cooc">${rows.map(([t,n])=>`<div class="crow" data-tag="${esc(t)}"><span>${esc(t)}</span><span class="cn">${n} shared</span></div>`).join('')||'<div class="empty">No co-occurring tags.</div>'}</div>`;
  openPanel('Tags that travel with “'+seed+'”','click one to filter by it',body);
}

/* ---------- Surprise ---------- */
function surprise(){
  if(!VIEW.length) return;
  const o=VIEW[Math.floor(Math.random()*VIEW.length)];
  openPanel('Surprise','random pick from your current view',cardHTML(o,null));
}

/* ---------- CSV export ---------- */
function toCSV(rows){
  const head=REQUIRED.join(',');
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=rows.map(o=>[o.Title,o.URL,o.Author,o.Date,o.Year,o.Karma,o.Votes,o.Comments,o.WordCount,o.Tags,o.ID].map(q).join(','));
  return head+'\n'+lines.join('\n');
}
function download(name,text){
  const blob=new Blob([text],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

/* ---------- Panel ---------- */
function openPanel(title,sub,body){
  $('#panelTitle').textContent=title;$('#panelSub').textContent=sub;$('#panelBody').innerHTML=body;
  $('#overlay').classList.add('show');
}
function closePanel(){$('#overlay').classList.remove('show');}

/* ---------- Settings persistence ---------- */
function saveSettings(){
  localStorage.setItem('lw_settings',JSON.stringify({
    k:$('#karmaFloor').value,sort:$('#sortSel').value,cat:$('#catSel').value
  }));
}
function restoreSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('lw_settings')||'{}');
    if(s.k)$('#karmaFloor').value=s.k;
    if(s.sort)$('#sortSel').value=s.sort;
    if(s.cat)$('#catSel').value=s.cat;
    syncPillStates();
  }catch(e){}
}

/* ---------- Wire up events ---------- */
// Dark mode
$('#themeBtn').onclick=toggleTheme;
$('#themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';

// Share view
$('#shareBtn').onclick=shareView;

// Mobile sidebar toggle
$('#filterToggle').onclick=()=>{
  $('#filterToggle').textContent=
    $('aside.controls').classList.toggle('open')?'Close ✕':'Filters '+(activeFilters()||'');
  $('aside.controls').classList.contains('open')
    ? $('#backdrop').classList.add('show')
    : $('#backdrop').classList.remove('show');
};
$('#backdrop').onclick=()=>{
  $('aside.controls').classList.remove('open');
  $('#backdrop').classList.remove('show');
  updateFilterBadge();
};

/* ── Sync visual pill/button state from underlying hidden form values ── */
function syncPillStates(){
  const k=+$('#karmaFloor').value;
  const hints={0:'All posts, no karma floor',25:'Got community attention (karma ≥ 25)',75:'Genuinely worth reading (karma ≥ 75)',200:'High signal — recommended (karma ≥ 200)',500:'Canonical must-read posts (karma ≥ 500)'};
  document.querySelectorAll('.qp').forEach(b=>b.classList.toggle('active',+b.dataset.k===k));
  const h=$('#qHint'); if(h)h.textContent=hints[k]||'karma ≥ '+k;
  const sort=$('#sortSel').value;
  document.querySelectorAll('.sp').forEach(b=>b.classList.toggle('active',b.dataset.sort===sort));
  const opts=[...$('#yearMin').options].map(o=>o.value);
  if(!opts.length)return;
  const yr1=$('#yearMin').value, yr2=$('#yearMax').value;
  const isAll=yr1===opts[0]&&yr2===opts[opts.length-1];
  document.querySelectorAll('.era-btn').forEach(b=>{
    if(b.dataset.y1===''){b.classList.toggle('active',isAll);return;}
    const eMin=opts.find(y=>+y>=+b.dataset.y1)||opts[0];
    const eMax=[...opts].reverse().find(y=>+y<=+b.dataset.y2)||opts[opts.length-1];
    b.classList.toggle('active',yr1===eMin&&yr2===eMax);
  });
}

let deb;
$('#search').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(update,130);});
['#catSel','#tagSel','#authorFilter','#bmOnly'].forEach(s=>$(s).addEventListener('change',update));
$('#authorFilter').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(update,200);});

/* Quality pills */
document.querySelectorAll('.qp').forEach(b=>{
  b.addEventListener('click',()=>{$('#karmaFloor').value=b.dataset.k;syncPillStates();update();});
});

/* Era buttons */
document.querySelectorAll('.era-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    const opts=[...$('#yearMin').options].map(o=>o.value);
    if(!opts.length)return;
    if(b.dataset.y1===''){
      $('#yearMin').value=opts[0]; $('#yearMax').value=opts[opts.length-1];
    } else {
      $('#yearMin').value=opts.find(y=>+y>=+b.dataset.y1)||opts[0];
      $('#yearMax').value=[...opts].reverse().find(y=>+y<=+b.dataset.y2)||opts[opts.length-1];
    }
    syncPillStates();update();
  });
});

/* Sort pills */
document.querySelectorAll('.sp').forEach(b=>{
  b.addEventListener('click',()=>{$('#sortSel').value=b.dataset.sort;syncPillStates();update();});
});

$('#surpriseBtn').onclick=surprise;
$('#authorsBtn').onclick=authorDeepDive;
$('#authorsBtnSide').onclick=authorDeepDive;
$('#tagCoocBtn').onclick=tagCooc;
$('#exportBtn').onclick=()=>download('haystack-view.csv',toCSV(VIEW));
$('#exportBmBtn').onclick=()=>download('haystack-bookmarks.csv',toCSV(ROWS.filter(r=>BOOKMARKS.has(r.ID))));
$('#panelClose').onclick=closePanel;
$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closePanel();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closePanel();
  if(e.key==='/'&&document.activeElement!==$('#search')){e.preventDefault();$('#search').focus();}
});

// event delegation for result cards
$('#results').addEventListener('click',e=>{
  if(e.target.id==='showMore'){RENDER_LIMIT+=100;renderResults();return;}
  // click author name in card → filter by that author
  if(e.target.classList.contains('alink')&&e.target.dataset.au){
    $('#authorFilter').value=e.target.dataset.au; update(); return;
  }
  const card=e.target.closest('.card'); if(!card) return;
  const id=card.dataset.id; const o=ROWS.find(r=>r.ID===id);
  if(e.target.classList.contains('star')){toggleBookmark(id);e.target.classList.toggle('on');e.target.textContent=BOOKMARKS.has(id)?'★':'☆';return;}
  if(e.target.classList.contains('mlt')){moreLikeThis(o);return;}
});

// panel delegation (author / tag / star / mlt clicks)
$('#panelBody').addEventListener('click',e=>{
  if(e.target.dataset.au!=null){$('#authorFilter').value=e.target.dataset.au;closePanel();update();}
  if(e.target.closest('[data-tag]')){const t=e.target.closest('[data-tag]').dataset.tag;$('#tagSel').value=t;closePanel();update();}
  if(e.target.classList.contains('alink')&&e.target.dataset.au){closePanel();$('#authorFilter').value=e.target.dataset.au;update();return;}
  const card=e.target.closest('.card');
  if(card){const id=card.dataset.id;
    if(e.target.classList.contains('star')){toggleBookmark(id);e.target.classList.toggle('on');e.target.textContent=BOOKMARKS.has(id)?'★':'☆';}
    if(e.target.classList.contains('mlt')){const o=ROWS.find(r=>r.ID===id);if(o)moreLikeThis(o);}
  }
});

/* ── Kick off auto-load ── */
autoLoad();
</script>
